name: Feature request
description: Suggest an improvement. Large ideas may need an RFC.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Hero to do?
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered?
