name: Release

# Publishing happens only from a tag that a maintainer signed and pushed (`vX.Y.Z`). Protect `v*`
# tags in the repository settings so only signed tags from maintainers can be created.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # attach the SBOM to the release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check, test, and build everything that will be published
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm api:check
          pnpm build:packages
          pnpm --filter @hero-cloud/cli build
      - name: The tag matches the version being published
        run: |
          version="$(node -p "require('./packages/sdk/package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Publish with provenance
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Software bill of materials for what people install
        run: |
          mkdir sbom && cd sbom
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "@hero-cloud/cli@${GITHUB_REF_NAME#v}"
          npm sbom --sbom-format cyclonedx > ../hero-cloud-cli.cdx.json
      - name: Attach the SBOM to the release
        run: gh release create "${GITHUB_REF_NAME}" hero-cloud-cli.cdx.json --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
